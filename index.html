<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebCraft Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
        
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 10px;
            pointer-events: auto;
        }
        
        .hotbar-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }
        
        .hotbar-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }
        
        #mobileControls {
            position: absolute;
            bottom: 100px;
            left: 20px;
            pointer-events: auto;
        }
        
        #joystick {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
        }
        
        #jumpBtn {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }
        
        #blockActions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="crosshair"></div>
            <div id="hotbar">
                <div class="hotbar-slot active" data-slot="0">🧱</div>
                <div class="hotbar-slot" data-slot="1">🪵</div>
                <div class="hotbar-slot" data-slot="2">🌳</div>
                <div class="hotbar-slot" data-slot="3">🪨</div>
                <div class="hotbar-slot" data-slot="4">💎</div>
                <div class="hotbar-slot" data-slot="5">🌿</div>
                <div class="hotbar-slot" data-slot="6">🌸</div>
                <div class="hotbar-slot" data-slot="7">🌊</div>
                <div class="hotbar-slot" data-slot="8">🔥</div>
            </div>
            <div id="mobileControls">
                <div id="joystick"></div>
            </div>
            <div id="jumpBtn">↑</div>
            <div id="blockActions">
                <div class="action-btn" id="placeBtn">➕</div>
                <div class="action-btn" id="breakBtn">➖</div>
            </div>
        </div>
        <div id="loading">Loading...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script src="https://unpkg.com/nipplejs@0.10.1/dist/nipplejs.js"></script>
    <script type="module" src="game.js"></script>

</body>
</html>
